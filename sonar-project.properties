# Identificación en SonarCloud
sonar.organization=jhordy-salirrosas
sonar.projectKey=Jhordy-Salirrosas_Sistema-gestion-mype-sunat
sonar.projectName=Sistema-gestion-mype-sunat

# Rutas de Análisis
