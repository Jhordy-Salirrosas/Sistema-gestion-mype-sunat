name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-and-test:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      # `npm run build` ejecuta `tsc -b && vite build`: cubre tipos y bundle.
      - name: Build
        run: npm run build

      # `npm run lint` tiene deuda previa (40 errores); se activará cuando llegue a cero.
